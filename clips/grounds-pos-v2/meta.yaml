onset_method: 'dark fraction of the table strip, relative to the clip''s own opening (brown is useless
  here: the coffee machine is brown). Rises 0.009 and holds; frames confirm a clean table at 7s and
  a heap at 9s. The same dark measure on the OVERHEAD clip reports 4.2s, which the frames refute —
  the robot arm crosses that crop. Overhead onset stays at the 7.0s the frames support.'
framing: centre-cropped 4:3 -> 16:9 to match the overhead corpus, because every model stretches its
