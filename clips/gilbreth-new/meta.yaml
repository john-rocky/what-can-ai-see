# The Gilbreth method — the 'after' half of a same-camera pair.
#
# Frank Gilbreth filmed industrial operations between 1910 and 1924 to measure the motions
# in them — the ancestor of every factory-floor camera this project is nominally about.
# A worker at a bench, a fixed tripod, a calibration grid on the wall behind, and a
# chronometer in shot so the film could be timed frame by frame.
#
# The pair is what makes it worth measuring. The film shows the SAME packing operation done
# two ways, and phase correlation says the camera did not move between them: cross-group
# shift has a median of 1.67 px on a 320x240 frame, inside the 0.69-14.34 px spread WITHIN
# each group. One tripod, two methods.
#
# F19 records that no real-footage pair in this corpus has a same-camera control. F28 got
# around it by removing colour — a change applied to the footage. This one is a control that
# actually happened in front of the lens: same camera, same bench, same worker, same task,
# a different way of doing it. Whether a VLM can tell two methods apart at all is the
# question a line-monitoring pitch rests on.
