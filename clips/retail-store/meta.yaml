ground_truth: >
  Inside a 1950s supermarket. Staff in uniform stock shelves and work a checkout; customers
  push carts along aisles of packaged goods. Signage is legible in places ("Picnic Supplies",
  "FRYING CHICKEN"). No single event: this is a continuous run of ordinary retail activity,
  which is what a shop camera actually sees.
