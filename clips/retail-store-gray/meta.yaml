# The colour control. Byte-for-byte the same frames as retail-store with saturation set to
# zero (`hue=s=0`) — same camera, same framing, same events, same compression settings, one
# channel of information removed. F19 records that no real-footage pair in this corpus has a
# same-camera control; this one does, because the difference is applied rather than found.
#
# The question it answers is a deployment question, not a curiosity: monitoring cameras are
# routinely infrared or low-light and deliver no colour, so "how much of what the model says
# was carried by colour" decides whether a daytime benchmark says anything about the night
# shift. Score it against retail-store with tools/repeat.py — the two are the same input
# under one controlled change, which is exactly the shape that tool compares.
#
# A supermarket floor in 1954: shelves, carts, staff, customers, readable signage. The
# retail monitoring case the project keeps naming as a destination, in the only long
# licence-clean colour footage found for it.
#
# Colour is the variable it adds. Every other clip in the film tier is monochrome or
# sepia, and in a shop colour is doing work — staff are in red, products are colour-coded,
# the signs are red on white. That makes the desaturation control (same camera, same
# framing, same event, colour removed) buildable here and nowhere else, which matters
# because monitoring cameras are routinely infrared or low-light and carry no colour at all.
