rejected: NOT SCOREABLE FROM THIS VIEW, and the reason is the result. The overhead camera first sees
  a hand at 6.6s, so that pair has 13 windows of clean lead-in. From the oblique camera the person's
  arm is in frame at t=0 and never leaves — there is no window in the 15s trim whose correct answer
  is No. So the 6.6s 'onset' is not when the situation became dangerous; it is when the overhead crop
  could first see it. Latency measured against it is a property of the camera placement, not of the
  model.
